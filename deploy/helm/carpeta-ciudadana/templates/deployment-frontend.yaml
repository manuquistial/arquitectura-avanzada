{{- if .Values.frontend.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "carpeta-ciudadana.fullname" . }}-frontend
  labels:
    app: frontend
    {{- include "carpeta-ciudadana.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "carpeta-ciudadana.name" . }}
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ include "carpeta-ciudadana.serviceAccountName" . }}
      containers:
      - name: frontend
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        {{- $public := .Values.frontend.publicBaseUrl | default "" }}
        {{- $publicTrim := regexReplaceAll "\\/$" $public "" }}
        # Service URLs for frontend
        - name: NEXT_PUBLIC_AUTH_SERVICE_URL
          {{- if $publicTrim }}
          value: "{{ $publicTrim }}/api/auth"
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "carpeta-ciudadana.fullname" . }}-app-config
              key: AUTH_URL
          {{- end }}
        - name: NEXT_PUBLIC_CITIZEN_SERVICE_URL
          {{- if $publicTrim }}
          value: "{{ $publicTrim }}/api/citizens"
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "carpeta-ciudadana.fullname" . }}-app-config
              key: CITIZEN_URL
          {{- end }}
        - name: NEXT_PUBLIC_INGESTION_SERVICE_URL
          {{- if $publicTrim }}
          value: "{{ $publicTrim }}"
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "carpeta-ciudadana.fullname" . }}-app-config
              key: INGESTION_URL
          {{- end }}
        - name: NEXT_PUBLIC_SIGNATURE_SERVICE_URL
          {{- if $publicTrim }}
          value: "{{ $publicTrim }}"
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "carpeta-ciudadana.fullname" . }}-app-config
              key: SIGNATURE_URL
          {{- end }}
        - name: NEXT_PUBLIC_TRANSFER_SERVICE_URL
          {{- if $publicTrim }}
          value: "{{ $publicTrim }}/api/transfers"
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "carpeta-ciudadana.fullname" . }}-app-config
              key: TRANSFER_URL
          {{- end }}
        - name: NEXT_PUBLIC_MINTIC_SERVICE_URL
          {{- if $publicTrim }}
          value: "{{ $publicTrim }}/api/mintic"
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "carpeta-ciudadana.fullname" . }}-app-config
              key: MINTIC_CLIENT_URL
          {{- end }}
        - name: NEXT_PUBLIC_METADATA_SERVICE_URL
          {{- if $publicTrim }}
          value: "{{ $publicTrim }}"
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "carpeta-ciudadana.fullname" . }}-app-config
              key: METADATA_URL
          {{- end }}
        - name: NEXT_PUBLIC_NOTIFICATION_SERVICE_URL
          {{- if $publicTrim }}
          value: "{{ $publicTrim }}"
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "carpeta-ciudadana.fullname" . }}-app-config
              key: NOTIFICATION_URL
          {{- end }}
        - name: NEXT_PUBLIC_API_URL
          {{- if $publicTrim }}
          value: "{{ $publicTrim }}"
          {{- else }}
          valueFrom:
            configMapKeyRef:
              name: {{ include "carpeta-ciudadana.fullname" . }}-app-config
              key: FRONTEND_URL
          {{- end }}
        - name: NODE_ENV
          value: "production"
        # NextAuth Configuration - from Kubernetes secrets
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: nextauth-secret
              key: NEXTAUTH_SECRET
              optional: true
        - name: NEXTAUTH_URL
          valueFrom:
            secretKeyRef:
              name: nextauth-secret
              key: NEXTAUTH_URL
              optional: true
        # Azure AD Configuration - from Kubernetes secrets
        # Azure AD B2C - REMOVED
        envFrom:
        - configMapRef:
            name: {{ include "carpeta-ciudadana.fullname" . }}-app-config
            optional: true
        - configMapRef:
            name: frontend-auth-config
            optional: true
        - secretRef:
            name: nextauth-secret
            optional: true
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 30
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 15
          successThreshold: 1
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "carpeta-ciudadana.fullname" . }}-frontend
  labels:
    app: frontend
    {{- include "carpeta-ciudadana.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
  - port: {{ .Values.frontend.service.port }}
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: frontend
---
{{- if .Values.frontend.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "carpeta-ciudadana.fullname" . }}-frontend
  labels:
    app: frontend
    {{- include "carpeta-ciudadana.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "carpeta-ciudadana.fullname" . }}-frontend
  minReplicas: {{ .Values.frontend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.frontend.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.frontend.autoscaling.targetCPUUtilizationPercentage }}
  {{- if .Values.frontend.autoscaling.targetMemoryUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.frontend.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
{{- end }}
{{- end }}
