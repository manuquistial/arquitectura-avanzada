{{- if .Values.citizen.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "carpeta-ciudadana.fullname" . }}-citizen
  labels:
    app: citizen
    {{- include "carpeta-ciudadana.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.citizen.replicaCount }}
  selector:
    matchLabels:
      app: citizen
      {{- include "carpeta-ciudadana.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: citizen
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "carpeta-ciudadana.name" . }}
        {{- include "carpeta-ciudadana.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "carpeta-ciudadana.serviceAccountName" . }}
      containers:
      - name: citizen
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.citizen.image.repository }}:{{ .Values.citizen.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: {{ .Values.global.environment | quote }}
        - name: ASPNETCORE_URLS
          value: "http://+:8000"
        # Service Bus configuration
        - name: SERVICEBUS_ENABLED
          value: "{{ .Values.serviceBus.enabled | default true }}"
        {{- if .Values.serviceBus.enabled }}
        - name: SERVICEBUS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: servicebus-secrets
              key: SERVICEBUS_CONNECTION_STRING
              # NOT optional: Citizen Service requires Service Bus to publish citizen events
              # Secret created by APPLICATION LAYER (Terraform) before this Helm chart
        {{- end }}
        # Database configuration
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DATABASE_URL
              optional: true
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_HOST
              optional: true
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_PORT
              optional: true
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_NAME
              optional: true
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_USER
              optional: true
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_PASSWORD
              optional: true
        - name: DB_SSLMODE
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_SSLMODE
              optional: true
        # JWT Configuration
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET_KEY
              optional: true
        - name: JWT_ALGORITHM
          value: "HS256"
        envFrom:
        - configMapRef:
            name: {{ include "carpeta-ciudadana.fullname" . }}-app-config
        - secretRef:
            name: jwt-secret
            optional: true
        resources:
          {{- toYaml .Values.citizen.resources | nindent 10 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "carpeta-ciudadana.fullname" . }}-citizen
  labels:
    app: citizen
    {{- include "carpeta-ciudadana.labels" . | nindent 4 }}
spec:
  type: {{ .Values.citizen.service.type }}
  ports:
  - port: {{ .Values.citizen.service.port }}
    targetPort: 8000
    name: http
  selector:
    app: citizen
---
{{- if .Values.citizen.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "carpeta-ciudadana.fullname" . }}-citizen
  labels:
    app: citizen
    {{- include "carpeta-ciudadana.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "carpeta-ciudadana.fullname" . }}-citizen
  minReplicas: {{ .Values.citizen.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.citizen.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.citizen.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

