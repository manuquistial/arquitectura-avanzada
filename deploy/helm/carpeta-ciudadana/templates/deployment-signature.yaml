{{- if .Values.signature.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "carpeta-ciudadana.fullname" . }}-signature
  labels:
    app: signature
    {{- include "carpeta-ciudadana.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.signature.replicaCount }}
  selector:
    matchLabels:
      app: signature
  template:
    metadata:
      labels:
        app: signature
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "carpeta-ciudadana.name" . }}
    spec:
      serviceAccountName: {{ include "carpeta-ciudadana.serviceAccountName" . }}
      
      {{- if .Values.signature.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.signature.nodeSelector | nindent 8 }}
      {{- end }}
      
      {{- if .Values.signature.tolerations }}
      tolerations:
        {{- toYaml .Values.signature.tolerations | nindent 8 }}
      {{- end }}
      
      {{- if .Values.signature.affinity }}
      affinity:
        {{- toYaml .Values.signature.affinity | nindent 8 }}
      {{- end }}
      
      terminationGracePeriodSeconds: {{ .Values.signature.terminationGracePeriodSeconds | default 30 }}
      
      containers:
      - name: signature
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.signature.image.repository }}:{{ .Values.signature.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ENVIRONMENT
          value: {{ .Values.global.environment | default "dev" }}
        - name: LOG_LEVEL
          value: {{ .Values.global.logLevel }}
        # DATABASE_URL is provided by the secret database-credentials
        - name: AZURE_STORAGE_ACCOUNT_NAME
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: AZURE_STORAGE_ACCOUNT_NAME
              optional: true
        - name: AZURE_STORAGE_ACCOUNT_KEY
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: AZURE_STORAGE_ACCOUNT_KEY
              optional: true
        - name: AZURE_STORAGE_CONTAINER_NAME
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: AZURE_STORAGE_CONTAINER_NAME
              optional: true
        - name: MINTIC_HUB_URL
          value: {{ .Values.mintic.hubUrl | default "https://govcarpeta-apis-4905ff3c005b.herokuapp.com" | quote }}
        - name: MINTIC_OPERATOR_ID
          value: {{ .Values.mintic.operatorId | default "demo-operator" | quote }}
        - name: MINTIC_OPERATOR_NAME
          value: {{ .Values.mintic.operatorName | default "Demo Operator" | quote }}
        # Redis configuration (fetched from Azure Key Vault via External Secrets)
        - name: REDIS_ENABLED
          value: "{{ .Values.redis.enabled | default true }}"
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: REDIS_HOST
              optional: true
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: REDIS_PORT
              optional: true
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: REDIS_PASSWORD
              optional: true
        - name: REDIS_SSL
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: REDIS_SSL
              optional: true
        - name: SERVICEBUS_ENABLED
          value: "{{ .Values.serviceBus.enabled | default true }}"
        {{- if .Values.serviceBus.enabled }}
        - name: SERVICEBUS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: servicebus-secrets
              key: SERVICEBUS_CONNECTION_STRING
              # NOT optional: Signature Service requires Service Bus to publish signature events
              # Secret created by APPLICATION LAYER (Terraform) before this Helm chart
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "carpeta-ciudadana.fullname" . }}-app-config
        - secretRef:
            name: database-credentials
            # NOT optional: Signature Service requires database to function
            # Secret created by External Secrets Operator from Azure Key Vault
        resources:
          {{- toYaml .Values.signature.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "carpeta-ciudadana.fullname" . }}-signature
  labels:
    app: signature
    {{- include "carpeta-ciudadana.labels" . | nindent 4 }}
spec:
  type: {{ .Values.signature.service.type }}
  ports:
  - port: {{ .Values.signature.service.port }}
    targetPort: 8000
    name: http
  selector:
    app: signature
---
{{- if .Values.signature.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "carpeta-ciudadana.fullname" . }}-signature
  labels:
    app: signature
    {{- include "carpeta-ciudadana.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "carpeta-ciudadana.fullname" . }}-signature
  minReplicas: {{ .Values.signature.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.signature.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.signature.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
